configs:
  traefik.yaml:
    file: ./traefik.yaml
secrets:
  cf_token:
    file: /secrets/cf_token
  mqtt_password:
    file: /secrets/mqtt_password
volumes:
  mosquitto_data:

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - cf_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /secrets/acme.json:/acme.json
    configs:
      - traefik.yaml
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_token
    command: --certificatesresolvers.le.acme.email=${ROBOT_ID}@rxsio.com
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.rule=Host(`traefik.${ROBOT_ID}.rxsio.com`)
      - traefik.http.routers.api.service=api@internal
  interface:
    image: ghcr.io/rxsio/robot-web-interface:nightly
    restart: unless-stopped
    volumes:
      - '/certificates:/certificates'
      - '/rover/configuration:/configuration'
      - '/rover/exchange:/exchange'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interface_http.entrypoints=web"
      - "traefik.http.routers.interface_http.rule=Host(`${ROBOT_ID}.rxsio.com`)"
      - "traefik.http.routers.interface_http.service=interface_80"
      - "traefik.http.routers.interface_https.rule=Host(`${ROBOT_ID}.rxsio.com`)"
      - "traefik.http.routers.interface_https.entrypoints=websecure"
      - "traefik.http.routers.interface_https.service=interface_443"
      - "traefik.http.services.interface_80.loadbalancer.server.port=80"
      - "traefik.http.services.interface_443.loadbalancer.server.port=443"
  cameras:
    image: ghcr.io/rxsio/webrtc-camera-server:nightly
    restart: unless-stopped
    network_mode: host # Required to expose wide range of ephemeral ports for WebRTC
    environment:
      - 'true'
    privileged: true
    volumes:
      - '/run/udev:/run/udev:ro'
      - '/dev:/dev'
      - '/certificates:/certificates'
      - '/rover/configuration:/configuration'
      - '/rover/exchange:/exchange'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webrtc_signaling.rule=Host(`webrtc.${ROBOT_ID}.rxsio.com`)"
      - "traefik.http.routers.webrtc_signaling.entrypoints=websecure"
      - "traefik.http.routers.webrtc_signaling.service=webrtc_8082"
      - "traefik.http.services.webrtc_8082.loadbalancer.server.port=8082"
  ros:
    image: ghcr.io/rxsio/firo_robot:humble
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true # This is intentional
    volumes:
      - '/rover/configuration:/configuration'
      - '/rover/exchange:/exchange'
    devices:
      - '/dev:/dev'
    environment:
      - ROS_LOCALHOST_ONLY=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ros_http.rule=Host(`ros.${ROBOT_ID}.rxsio.com`)"
      - "traefik.http.routers.ros_http.entrypoints=websecure"
      - "traefik.http.services.ros_8081.loadbalancer.server.port=8081"
  influx:
    image: influxdb:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:8086:8086
    volumes:
      - /rover/data/influxdb-data:/var/lib/influxdb2:rw
      - /rover/data/influxdb-config:/etc/influxdb2:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influx.rule=Host(`influx.${ROBOT_ID}.rxsio.com`)"
      - "traefik.http.routers.influx.entrypoints=websecure"
      - "traefik.http.routers.influx.service=influx_8086"
      - "traefik.http.services.influx_8086.loadbalancer.server.port=8086"
  telegraf:
    image: telegraf:1.25-alpine
    restart: unless-stopped
    depends_on:
      - influx
    network_mode: host # This is intentional: required for wireless network telemetry
    volumes:
      - /rover/configuration/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /sys:/host_sys:ro
      - /:/hostfs:ro
    env_file:
      - /rover/influx.env
  influx_server:
    image: influxdb:latest
    restart: unless-stopped
    volumes:
      - /rover/server/influxdb-data:/var/lib/influxdb2:rw
      - /rover/server/influxdb-config:/etc/influxdb2:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influx_server.rule=Host(`influx.rxsio.com`)"
      - "traefik.http.routers.influx_server.entrypoints=websecure"
      - "traefik.http.routers.influx_server.service=influx_server_8086"
      - "traefik.http.services.influx_server_8086.loadbalancer.server.port=8086"
  grafana_server:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=200ms
    volumes:
      - /rover/server/grafana-data:/var/lib/grafana:rw
    restart: unless-stopped
    user: "0"
    depends_on:
      - influx_server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.rxsio.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.service=grafana_3000"
      - "traefik.http.services.grafana_3000.loadbalancer.server.port=3000"
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - 127.0.0.1:1883:1883
    volumes:
      - ./configuration/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./configuration/mosquitto/acl:/etc/mosquitto/acl:ro
      - mosquitto_log:/mosquitto/log
    secrets:
      - mqtt_password
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.services.mosquitto_1883.loadbalancer.servers.address=127.0.0.1:1883"
      - "traefik.tcp.routers.mqtt.rule=HostSNI(`mqtt.${ROBOT_ID}.rxsio.com`)"
      - "traefik.tcp.routers.mqtt.entrypoints=mqtt"
      - "traefik.tcp.routers.mqtt.service=mosquitto_1883"
      - "traefik.tcp.routers.mqtt.tls=true"
  radcon:
    image: radcon:latest
    restart: unless-stopped
    volumes:
      - /dev/radcon:/dev/radcon
    device_cgroup_rules:
      - 'c 189:* rmw'
    command: --host firo2 --device /dev/radcon/0 --broker tcp://127.0.0.1:1883 --persistent
